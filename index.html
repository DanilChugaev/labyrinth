    <title>Labyrinth — процедурно генерируемые лабиринты</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('LABYRINTH_THEME_KEY');

          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]')?.setAttribute(
              'content',
              theme === 'dark' ? '#1a1e28' : '#f0f2f5',
            );
          }
        } catch {
          // The system preference is used when storage is unavailable.
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GameApplication",
        "name": "Labyrinth",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "ru",
        "url": "https://danilchugaev.github.io/labyrinth/",
        "description": "Игра с процедурно генерируемыми лабиринтами для клавиатуры и сенсорных экранов.",
        "image": "https://danilchugaev.github.io/labyrinth/icon-512x512.png"
      }
    </script>
